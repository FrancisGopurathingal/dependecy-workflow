name: "Dependency Review"
on:
   [pull_request]
   [workflow_dispatch]

permissions:
   content: read
  
jobs:
  dependency-review:
     runs-on: ubuntu-latest
     steps:
       - name: 'Checkout Repository'
         uses: actions/checkout@v6
       - name: 'License Check'
         uses: actions/dependency-review-action@v5
         with:
           config-file: '.github/dependency-review-config.yml'